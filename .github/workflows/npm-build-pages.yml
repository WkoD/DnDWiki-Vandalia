name: NPM build index.html

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: master
        fetch-depth: 0
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Install dependencies (tiddlywiki + TiddlyDnD-Plugins)
      run: npm install
    - name: Update master
      run: |
        echo '${{ github.event.repository.name }}' >> './tiddlers/$__SiteTitle.tid'
        echo $(TZ=Europe/Berlin date +'%Y-%m-%dT%H:%M:%S') >> './tiddlers/$__SiteSubtitle.tid'
    - name: Disable saving in the published (read-only) copy
      # Created only at CI build time, never lands in the Git repo - a local `npm start`
      # stays fully editable. IsReadOnly is the switch: dndwiki-core (from 1.4.1) then hides
      # edit/clone/delete/new/import/manager and the save button. Empty SaverFilter = never
      # "unsaved changes".
      # Important: IsReadOnly is compared as an exact string and must NOT have a trailing
      # newline in the body (hence printf instead of cat<<EOF).
      run: |
        printf 'title: $:/config/SaverFilter\ntype: text/vnd.tiddlywiki\n\n[[]] -[[]]' > './tiddlers/$__config_SaverFilter.tid'
        printf 'title: $:/status/IsReadOnly\ntype: text/vnd.tiddlywiki\n\nyes' > './tiddlers/$__status_IsReadOnly.tid'
    - name: Build TiddlyWiki master index.html
      # The Node launcher scripts/tw.js sets TIDDLYWIKI_PLUGIN_PATH from ALL plugin packages
      # (tiddlydnd-plugins + tw5-graph/vis-network/relink) + process.noDeprecation.
      # NOT `npx tiddlywiki` with the bundle path only - the flibbles/graph stack would be missing.
      run: npm run build
    - name: Copy resource directories
      run: |
        cp -rl ./data ./twpage/data
        cp -rl ./images ./twpage/images
        find ./twpage -type f -name '.keep' -exec rm {} +
    - name: Deploy to gh_pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./twpage
